      <small class="muted" data-wa-hint>اختر السائق وأدخل رقم الزبون والمسار لتفعيل الزر.</small></div>
    <div class="field full"><span>الرسالة الصوتية</span><div class="voice-box" data-voice></div></div>
    <label class="field full"><span>ملاحظات</span><textarea class="input" name="notes" rows="2">${esc(o ? o.notes || '' : '')}</textarea></label>
    <p class="err full" data-err hidden></p>
    <div class="modal-actions full">
      ${isEdit ? `<button type="button" class="btn warn-soft" data-del style="margin-inline-end:auto">${ic('trash')} حذف الطلب</button>` : ''}
      <button type="button" class="btn ghost" data-close>رجوع</button>
      <button type="submit" class="btn primary">${isEdit ? 'حفظ التعديلات' : 'حفظ الطلب'}</button>
    </div>
  </form>
  <datalist id="dm-places">${[...app.places].map((p) => `<option value="${esc(p)}"></option>`).join('')}</datalist>`;

  let vw = null;
  const res = await showModal({
    title: isEdit ? `الطلب ${o.ref}` : 'طلب توصيل جديد', html, wide: true,
    onMount: (m, close) => {
      const form = $('form', m), calc = $('[data-calc]', m), err = $('[data-err]', m);
      vw = voiceWidget($('[data-voice]', m), o && o.voice_path);
      const values = () => {
        const fd = new FormData(form);
        return {
          date: fd.get('date'), time: fd.get('time'), customer_phone: cleanPhone(fd.get('customer_phone')), driver_id: fd.get('driver_id'),
          pickup: String(fd.get('pickup') || '').trim(), dropoff: String(fd.get('dropoff') || '').trim(),
          price: String(fd.get('price') || '').trim(), status: fd.get('status') || 'pending', notes: String(fd.get('notes') || '').trim(),
        };
      };
      const after = (v) => {
        const drv = app.drivers.find((d) => d.id === v.driver_id);
        const c = round2(num(v.price) * r);
        if (!drv) return { drv, c, bal: null };
        let base = num(drv.balance);
        if (isEdit && o.status === 'completed' && o.driver_id === drv.id) base += num(o.commission);
        return { drv, c, bal: round2(v.status === 'completed' ? base - c : base) };
      };
      const upd = () => {
        const v = values(); const a = after(v);
        calc.className = 'calc full' + (a.bal != null && a.bal < 0 ? ' warn' : '');
        calc.innerHTML = `<span>عمولتك (${pct(r)}): <b>${money(a.c)}</b> ${cur()}</span>`
          + (a.drv ? `<span>رصيد السائق ${v.status === 'completed' ? 'بعد الخصم' : 'الحالي'}: <b>${money(a.bal)}</b> ${cur()}</span>` : '')
          + (v.status === 'completed' ? '' : '<span>تُخصم العمولة من رصيد السائق عند إكمال الطلب فقط.</span>');
      };
      const wa = $('[data-wa]', m), waHint = $('[data-wa-hint]', m);
      const updWa = () => {
        const val = values();
        const drv = app.drivers.find((d) => d.id === val.driver_id);
        const to = waNumber(val.customer_phone);
        if (!drv || !to || !val.pickup || !val.dropoff) {
          wa.removeAttribute('href'); wa.setAttribute('aria-disabled', 'true'); waHint.hidden = false; return;
        }
        const lines = [
          'مرحباً،',
          'تم تأكيد طلب التوصيل الخاص بكم.',
          isEdit ? `رقم الطلب: ${o.ref}` : null,
          val.date && val.time ? `التاريخ والوقت: ${fmtDate(val.date)} ${val.time}` : null,
          `من: ${val.pickup}`,
          `إلى: ${val.dropoff}`,
          val.price !== '' ? `سعر التوصيل: ${money(val.price)} ${curText()}` : null,
          '',
          `السائق: ${drv.name || '—'}`,
          `هاتف السائق: ${drv.phone}`,
          drv.plate_number ? `رقم لوحة الدراجة: ${drv.plate_number}` : null,
          '',
          `شكراً لثقتكم – ${app.settings.business_name}`,
        ].filter((x) => x !== null);
        wa.href = `https://wa.me/${to}?text=${encodeURIComponent(lines.join('\n'))}`;
        wa.removeAttribute('aria-disabled'); waHint.hidden = true;
      };
      form.addEventListener('input', upd); form.addEventListener('change', upd); upd();
      form.addEventListener('input', updWa); form.addEventListener('change', updWa); updWa();

      $('[data-add-driver]', m).onclick = async () => {
        const nd = await driverForm();
        if (!nd) return;
        const sel = $('select[name=driver_id]', form);
        sel.innerHTML = `<option value="">اختر السائق</option>${driverOptions(nd.id, o && o.driver_id)}`;
        upd(); updWa();
      };
      const del = $('[data-del]', m);
      if (del) del.onclick = async () => {
        if (!(await confirmBox(`حذف الطلب ${o.ref} نهائياً؟ إذا كان مكتملاً فستُعاد عمولته إلى رصيد السائق.`, { ok: 'حذف الطلب', danger: true }))) return;
        try {
          await app.api.deleteOrder(o.id);
          if (o.voice_path) app.api.deleteVoice(o.voice_path);
          app.orderIndex.delete(o.id);
          toast(`تم حذف الطلب ${o.ref}.`);
          close('deleted');
        } catch (e) { err.textContent = errMsg(e); err.hidden = false; }
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const v = values();
        const fail = (msg) => { err.textContent = msg; err.hidden = false; err.scrollIntoView({ block: 'nearest' }); };
        if (vw.recording) return fail('أوقف التسجيل الصوتي أولاً.');
        if (!v.date || !v.time) return fail('أدخل تاريخ ووقت الطلب.');
        if (v.customer_phone.length < 4) return fail('أدخل رقم هاتف الزبون.');
        if (!v.driver_id) return fail('اختر السائق.');
        if (!v.pickup || !v.dropoff) return fail('أدخل مكان الانطلاق والوجهة.');
        if (v.price === '' || !(num(v.price) >= 0)) return fail('أدخل سعر التوصيل.');
        err.hidden = true;
        const a = after(v);
        if (v.status === 'completed' && a.bal != null && a.bal < 0 && !(isEdit && o.status === 'completed' && o.driver_id === v.driver_id && num(o.price) === num(v.price))) {
          if (!(await confirmBox(`رصيد السائق لا يكفي لعمولة ${money(a.c)} ${curText()}. سيصبح الرصيد ${money(a.bal)}. هل تريد المتابعة؟`, { ok: 'متابعة' }))) return;
        }
        const btn = $('[type=submit]', form);
        busy(btn, true, 'جارٍ الحفظ');
        try {
          let voice_path = o ? o.voice_path || null : null;
          if (vw.file) voice_path = await app.api.uploadVoice(vw.file);
          else if (vw.removed) voice_path = null;
          const payload = {
            ordered_at: new Date(`${v.date}T${v.time}`).toISOString(), customer_phone: v.customer_phone, driver_id: v.driver_id,
            pickup: v.pickup, dropoff: v.dropoff, price: num(v.price), status: v.status, notes: v.notes || null, voice_path,
          };
          if (isEdit) payload.id = o.id;
          const saved = await app.api.saveOrder(payload);
          if (o && o.voice_path && o.voice_path !== voice_path) app.api.deleteVoice(o.voice_path);
          app.places.add(v.pickup); app.places.add(v.dropoff);
          app.orderIndex.set(saved.id, saved);
          toast(isEdit ? `تم حفظ الطلب ${saved.ref}.` : `تم تسجيل الطلب ${saved.ref}.`);
          close(saved);
        } catch (ex) { busy(btn, false); fail(errMsg(ex)); }
      });
    },
  });
  if (vw) vw.dispose();
  if (res) { invalidate(); await loadDrivers().catch(() => { }); render(); }
  return res;
}

        const u = await app.api.docUrl(existingPath);
        if (u) img.src = u; else img.outerHTML = '<span class="muted">الصورة غير متوفرة في الوضع التجريبي بعد إعادة التحميل.</span>';
      } catch (e) { img.outerHTML = `<span class="err">${esc(errMsg(e))}</span>`; }
    }
  };
  box.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-p]');
    if (b && b.dataset.p === 'clear') { st.file = null; st.removed = true; draw(); }
  });
  box.addEventListener('change', (e) => {
    if (!e.target.matches('[data-p=file]')) return;
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (!/^image\//.test(f.type) && !/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)) { toast('اختر صورة لبطاقة التعريف.', 'warn'); return; }
    if (f.size > 25 * 1024 * 1024) { toast('الصورة كبيرة جداً.', 'bad'); return; }
    if (st.url) URL.revokeObjectURL(st.url);
    st.file = f; st.url = URL.createObjectURL(f); st.removed = true; draw();
  });
  draw();
  return { get file() { return st.file; }, get removed() { return st.removed; } };
}

async function driverForm(d = null) {
  const isEdit = !!d;
  const html = `<form class="form-grid" novalidate>
    <label class="field"><span>رقم هاتف السائق</span><input class="input" type="tel" inputmode="tel" dir="ltr" name="phone" value="${esc(d ? d.phone : '')}" autocomplete="off" required></label>
    <label class="field"><span>الاسم الكامل</span><input class="input" name="name" value="${esc(d ? d.name || '' : '')}" autocomplete="off"></label>
    <label class="field"><span>رقم بطاقة التعريف (NNI)</span><input class="input" name="cin_number" inputmode="numeric" dir="ltr" value="${esc(d ? d.cin_number || '' : '')}" autocomplete="off" required></label>
    <label class="field"><span>رقم لوحة الدراجة (Matricule)</span><input class="input" name="plate_number" dir="ltr" autocapitalize="characters" value="${esc(d ? d.plate_number || '' : '')}" autocomplete="off" required></label>
    <div class="field full"><span>صورة بطاقة التعريف</span><div class="photo-box" data-photo></div>
      <small>صوّر البطاقة بوضوح. تُحفظ الصورة في مساحة خاصة لا يطّلع عليها إلا حساب المسير.</small></div>
    ${isEdit ? `<div class="field full"><span>الحالة</span><div class="seg"><label><input type="radio" name="active" value="1" ${d.active ? 'checked' : ''}><span>نشط</span></label>
      <label><input type="radio" name="active" value="0" ${d.active ? '' : 'checked'}><span>موقوف</span></label></div>
      <small>السائق الموقوف لا يظهر عند تسجيل طلب جديد، ويبقى سجله محفوظاً.</small></div>` : ''}
    <label class="field full"><span>ملاحظات</span><input class="input" name="notes" value="${esc(d ? d.notes || '' : '')}" autocomplete="off"></label>
    <p class="err full" data-err hidden></p>
    <div class="modal-actions full">
      ${isEdit ? `<button type="button" class="btn warn-soft" data-del style="margin-inline-end:auto">${ic('trash')} حذف السائق</button>` : ''}
      <button type="button" class="btn ghost" data-close>رجوع</button>
      <button type="submit" class="btn primary">${isEdit ? 'حفظ التعديلات' : 'تسجيل السائق'}</button></div>
  </form>`;
  const res = await showModal({
    title: isEdit ? 'تعديل بيانات السائق' : 'تسجيل سائق جديد', html, wide: true,
    onMount: (m, close) => {
      const form = $('form', m), err = $('[data-err]', m);
      const pw = photoWidget($('[data-photo]', m), d && d.cin_photo_path);
      const fail = (msg) => { err.textContent = msg; err.hidden = false; err.scrollIntoView({ block: 'nearest' }); };
      const del = $('[data-del]', m);
      if (del) del.onclick = async () => {
        if (!(await confirmBox(`حذف السائق ${dtext(d)}؟`, { ok: 'حذف', danger: true }))) return;
        try {
          await app.api.deleteDriver(d.id);
          if (d.cin_photo_path) app.api.deleteDoc(d.cin_photo_path);
          toast('تم حذف السائق.'); close('deleted');
        } catch (e) { fail(errMsg(e)); }
      };
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const phone = cleanPhone(fd.get('phone'));
        const cin = String(fd.get('cin_number') || '').trim();
        const plate = String(fd.get('plate_number') || '').trim().toUpperCase();
        if (phone.length < 4) return fail('أدخل رقم هاتف السائق.');
        if (cin.length < 4) return fail('أدخل رقم بطاقة التعريف.');
        if (plate.length < 2) return fail('أدخل رقم لوحة الدراجة.');
        err.hidden = true;
        const btn = $('[type=submit]', form);
        busy(btn, true, 'جارٍ الحفظ');
        try {
          let photo = d ? d.cin_photo_path || null : null;
          if (pw.file) photo = await app.api.uploadDoc(await compressImage(pw.file));
          else if (pw.removed) photo = null;
          const saved = await app.api.saveDriver({
            id: d ? d.id : undefined, phone, name: String(fd.get('name') || '').trim(), notes: String(fd.get('notes') || '').trim(),
            active: isEdit ? fd.get('active') === '1' : true, cin_number: cin, plate_number: plate, cin_photo_path: photo,
          });
          if (d && d.cin_photo_path && d.cin_photo_path !== photo) app.api.deleteDoc(d.cin_photo_path);
          await loadDrivers();
          toast(isEdit ? 'تم حفظ بيانات السائق.' : `تم تسجيل السائق ${dtext(saved)}.`);
          close(saved);
        } catch (ex) { busy(btn, false); fail(errMsg(ex)); }
      });
    },
  });
  if (res === 'deleted') { await loadDrivers().catch(() => { }); location.hash = 'drivers'; render(); return null; }
  if (res && !$('.modal-wrap:not(.closing)')) { invalidate(); render(); }
  return res;
}

const ACTIONS = {

  'edit-order': async (id) => { let o = app.orderIndex.get(id); if (o) return orderForm(o); },
  'complete-order': async (id) => {
    const o = app.orderIndex.get(id); if (!o) return;
    if (!app.drivers.length) await loadDrivers();
    const d = app.drivers.find((x) => x.id === o.driver_id);
    const c = round2(num(o.price) * num(o.commission_rate));
    const after = d ? round2(num(d.balance) - c) : 0;
    if (d && after < 0 && !(await confirmBox(`رصيد ${dtext(d)} هو ${money(d.balance)} ${curText()} ولا يكفي لعمولة ${money(c)}. سيصبح الرصيد ${money(after)}. هل تريد إكمال الطلب؟`, { ok: 'إكمال الطلب' }))) return;
    await app.api.setOrderStatus(id, 'completed');
    toast(`اكتمل الطلب ${o.ref}، وخُصمت عمولة ${money(c)} ${curText()} من رصيد السائق.`);
    invalidate(); await loadDrivers(); render();
  },
  'cancel-order': async (id) => {
    const o = app.orderIndex.get(id); if (!o) return;
    if (!(await confirmBox(`إلغاء الطلب ${o.ref}؟ لن تُحسب عليه أي عمولة.`, { ok: 'إلغاء الطلب', danger: true }))) return;
    await app.api.setOrderStatus(id, 'cancelled');
    toast(`تم إلغاء الطلب ${o.ref}.`);
    invalidate(); await loadDrivers(); render();

  'play-voice': async (id) => {

    invalidate(); await loadDrivers(); render();
  },

  'edit-driver': async (id) => { const d = app.drivers.find((x) => x.id === id) || (await app.api.getDriver(id)); return driverForm(d); },
  'open-driver': (id) => { app.driverId = id; if (location.hash === '#driver') render(); else location.hash = 'driver'; },
  'back-drivers': () => { location.hash = 'drivers'; },
  'print': () => printPage(),
  'retry': () => render(),
  'export-orders': () => downloadCSV(`orders-${today()}.csv`, [
    ['رقم المعاملة', 'التاريخ', 'الوقت', 'رقم الزبون', 'رقم السائق', 'اسم السائق', 'من', 'إلى', 'سعر التوصيل', 'الحالة', 'العمولة', 'ملاحظات'],
    ...(app.last.orders || []).map((o) => [o.ref, fmtDate(o.ordered_at), fmtTime(o.ordered_at), o.customer_phone, o.driver ? o.driver.phone : '', o.driver ? o.driver.name || '' : '',
      o.pickup, o.dropoff, num(o.price), (STATUS[o.status] || {}).label, num(o.commission), o.notes || '']),
  ]),
  'export-topups': () => downloadCSV(`topups-${today()}.csv`, [
    ['التاريخ', 'الوقت', 'رقم السائق', 'اسم السائق', 'طريقة الدفع', 'المبلغ', 'ملاحظات'],
    ...(app.last.topups || []).map((t) => [fmtDate(t.topup_at), fmtTime(t.topup_at), t.driver ? t.driver.phone : '', t.driver ? t.driver.name || '' : '', t.method || '', num(t.amount), t.notes || '']),
  ]),

    ...(app.last.daily || []).map((r) => [fmtDate(r.day), num(r.completed_orders), num(r.orders_value), num(r.commission), num(r.topups)]),
  ]),

    await app.api.signOut(); renderLogin();
  },

    try { await app.api.signOut(); } catch (e) { /* ignoré */ }
    local.del('dm.config'); local.del('dm.mode'); boot();
  },
  'leave-demo': () => { local.del('dm.mode'); boot(); },
  'reset-demo': async () => {
    if (!(await confirmBox('استبدال كل البيانات التجريبية على هذا الجهاز ببيانات جديدة؟', { ok: 'إعادة البيانات', danger: true }))) return;
    app.api.reset(); invalidate(); app.orderIndex.clear(); await loadDrivers(); toast('تمت إعادة البيانات التجريبية.'); render();
  },

document.addEventListener('click', async (e) => {
  if (e.target.closest('a[data-tel]')) return;
  const el = e.target.closest('[data-action]');
  if (!el || !ACTIONS[el.dataset.action]) return;
  e.preventDefault();
  if (el.dataset.busy) return;
  el.dataset.busy = '1';
  try { await ACTIONS[el.dataset.action](el.dataset.id, el, e); }
  catch (err) { console.error(err); toast(errMsg(err), 'bad'); }
  finally { delete el.dataset.busy; }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest && e.target.closest('[data-action][tabindex]');
  if (el && el === e.target) { e.preventDefault(); el.click(); }
});
window.addEventListener('hashchange', () => { if ($('#main')) render(); });

/* =====================================================================
   DÉMARRAGE : configuration, connexion
   ===================================================================== */
const gate = (inner) => { $('#root').innerHTML = `<div class="gate"><div class="gate-card">
  <div class="brand"><div class="brand-mark">${ic('truck')}</div><div class="brand-text"><b>Delivery Manager</b><span>إدارة التوصيل وأرصدة السائقين</span></div></div>${inner}</div></div>`; };

function copySQL() {
  const fallback = () => showModal({
    title: 'كود إعداد قاعدة البيانات', wide: true,
    html: `<p class="muted">حدد النص كله وانسخه، ثم الصقه في Supabase ← SQL Editor.</p>
      <textarea class="input" readonly rows="14" dir="ltr" style="font-family:ui-monospace,Menlo,monospace;font-size:12px">${esc(SETUP_SQL)}</textarea>`,
    onMount: (m) => { const t = $('textarea', m); t.addEventListener('focus', () => t.select()); },
  });
  try {
    navigator.clipboard.writeText(SETUP_SQL).then(() => toast('تم نسخ كود الإعداد. الصقه في SQL Editor ثم اضغط Run.'), fallback);
  } catch (e) { fallback(); }
}

function renderSetup() {
  gate(`<h1>إعداد التطبيق</h1>
    <p class="muted">اربط التطبيق بقاعدة بيانات Supabase المجانية لحفظ الطلبات والأرصدة بأمان على الإنترنت، أو جرّبه أولاً ببيانات تجريبية.</p>
    <ol class="steps">
      <li>أنشئ مشروعاً مجانياً على <span class="ltr">supabase.com</span>.</li>
      <li>افتح <span class="ltr">SQL Editor</span> والصق كود الإعداد ثم اضغط <span class="ltr">Run</span>.
        <div style="margin-top:8px"><button type="button" class="btn sm" data-copy-sql>${ic('copy')} نسخ كود الإعداد</button></div></li>
      <li>من <span class="ltr">Authentication → Users</span> أضف حساب المسير <span class="ltr">(Add user)</span> مع تفعيل <span class="ltr">Auto Confirm</span>.</li>
      <li>من <span class="ltr">Project Settings → API</span> انسخ <span class="ltr">Project URL</span> والمفتاح العام <span class="ltr">(anon / publishable)</span>.</li>
    </ol>
    <form class="split" novalidate data-setup>
      <label class="field"><span>Project URL</span><input class="input" name="url" dir="ltr" placeholder="https://xxxx.supabase.co" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label class="field"><span>المفتاح العام (anon key)</span><textarea class="input" name="key" dir="ltr" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></label>
      <p class="err" data-err hidden></p>
      <button type="submit" class="btn primary lg">ربط ومتابعة</button>
    </form>
    <p class="or">أو</p>
    <button type="button" class="btn lg" data-demo>تجربة التطبيق ببيانات تجريبية</button>`);
  $('[data-copy-sql]').onclick = copySQL;
  $('[data-demo]').onclick = () => { local.set('dm.mode', 'demo'); boot(); };
  $('[data-setup]').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const url = String(fd.get('url') || '').trim().replace(/\/+$/, '');
    const key = String(fd.get('key') || '').replace(/\s+/g, '');
    const err = $('[data-err]');
    if (!/^https:\/\/[^\s/]+\.[^\s/]+$/.test(url)) { err.textContent = 'أدخل رابط المشروع كاملاً، مثل https://xxxx.supabase.co'; err.hidden = false; return; }
    if (key.length < 20) { err.textContent = 'أدخل المفتاح العام (anon key) كما هو في Supabase.'; err.hidden = false; return; }
    local.set('dm.config', { url, key }); local.set('dm.mode', 'cloud');
    boot();
  });
}

function renderLogin() {
  gate(`<h1>تسجيل الدخول</h1>
    <form class="split" novalidate data-login>
      <label class="field"><span>البريد الإلكتروني</span><input class="input" type="email" name="email" dir="ltr" autocomplete="username" autocapitalize="off" required></label>
      <label class="field"><span>كلمة المرور</span><input class="input" type="password" name="password" dir="ltr" autocomplete="current-password" required></label>
      <p class="err" data-err hidden></p>
      <button type="submit" class="btn primary lg">دخول</button>
    </form>
    ${app.cfg && !app.cfg.fixed ? '<button type="button" class="btn ghost" data-reset-cfg>تغيير إعداد الاتصال</button>' : ''}`);
  const rc = $('[data-reset-cfg]');
  if (rc) rc.onclick = () => { local.del('dm.config'); local.del('dm.mode'); boot(); };
  $('[data-login]').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const err = $('[data-err]'), btn = $('[type=submit]', e.target);
    busy(btn, true, 'جارٍ الدخول');
    try {
      await app.api.signIn(String(fd.get('email')).trim(), String(fd.get('password')));
      const s = await app.api.session();
      app.user = s && s.user;
      start();
    } catch (ex) { busy(btn, false); err.textContent = errMsg(ex); err.hidden = false; }
  });
}

function renderGateError(msg, canReset, canLogout) {
  gate(`<h1>تعذر تشغيل التطبيق</h1><p class="notice bad">${esc(msg)}</p>
    ${msg.includes('SQL') ? `<button type="button" class="btn" data-copy-sql>${ic('copy')} نسخ كود الإعداد</button>` : ''}
    <button type="button" class="btn primary lg" data-retry>إعادة المحاولة</button>
    ${canLogout ? `<button type="button" class="btn" data-logout>${ic('logout')} تسجيل الخروج</button>` : ''}
    ${canReset !== false && !(app.cfg && app.cfg.fixed) ? '<button type="button" class="btn ghost" data-reset-cfg>تغيير إعداد الاتصال</button>' : ''}`);
  $('[data-retry]').onclick = boot;
  const lo = $('[data-logout]'); if (lo) lo.onclick = async () => { try { await app.api.signOut(); } catch (e) { /* ignoré */ } boot(); };
  const c = $('[data-copy-sql]'); if (c) c.onclick = copySQL;
  const r = $('[data-reset-cfg]'); if (r) r.onclick = () => { local.del('dm.config'); local.del('dm.mode'); boot(); };
}

async function start() {
  try { app.settings = await app.api.getSettings(); }
  catch (e) {
    console.error(e);
    if (e && e.code === 'PGRST116') return renderGateError('هذا الحساب لا يملك صلاحية الوصول إلى بيانات التطبيق. سجّل الدخول بحساب المسير.', true, true);
    return renderGateError(errMsg(e), true, app.api.mode === 'cloud');
  }
  renderShell();
  render();
}

async function boot() {
  $('#root').innerHTML = '<div class="loading" style="min-height:100vh"><span class="spin"></span></div>';
  app.orderIndex.clear(); app.drivers = []; invalidate(); app.places = new Set();
  const fixed = CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY;
  const cfg = fixed ? { url: CONFIG.SUPABASE_URL.trim().replace(/\/+$/, ''), key: CONFIG.SUPABASE_ANON_KEY.trim(), fixed: true } : local.get('dm.config');
  const mode = DEMO_BUILD ? 'demo' : fixed ? 'cloud' : local.get('dm.mode');
  app.cfg = null;
  if (mode === 'demo') { app.api = new DemoAPI(); app.user = { email: 'demo' }; return start(); }
  if (mode !== 'cloud' || !cfg) return renderSetup();
  app.cfg = cfg;
  try {
    if (!window.supabase) await loadScript(SUPABASE_JS);
    app.api = new CloudAPI(cfg.url, cfg.key);
  } catch (e) {
    console.error(e);
    return renderGateError('تعذر تحميل مكتبة الاتصال بقاعدة البيانات. تحقق من الإنترنت ثم أعد المحاولة.');
  }
  app.api.onAuthLost(() => { if ($('#main')) renderLogin(); });
  let session = null;
  try { session = await app.api.session(); } catch (e) { /* ignoré */ }
  if (!session) return renderLogin();
  app.user = session.user;
  start();
}

boot();
