  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--green); }
h1, h2, h3, p { margin: 0; }
.num, .money, td, .orow, .kpi-value, .hero-value { font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--green) 55%, white); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--card); color: var(--ink);
  font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .05s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
.btn.primary:hover { background: var(--green-ink); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #2B1E00; }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--gray-soft); }
.btn.on-dark { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.28); color: #fff; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.lg { min-height: 52px; padding: 0 22px; font-size: 17px; border-radius: 14px; }
.btn.ok-soft { background: var(--green-soft); border-color: transparent; color: var(--green-ink); }
.btn.warn-soft { background: var(--red-soft); border-color: transparent; color: var(--red); }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px;
  border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); cursor: pointer;
}
.icon-btn:hover { background: var(--gray-soft); }
.spin { width: 18px; height: 18px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- structure ---------- */
.shell { min-height: 100vh; }
.side {
  position: fixed; inset-block: 0; inset-inline-start: 0; width: var(--side);
  display: flex; flex-direction: column; gap: 4px;
  padding: calc(22px + env(safe-area-inset-top, 0px)) 14px 22px; background: var(--card); border-inline-end: 1px solid var(--line);
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
.brand-mark { width: 40px; height: 40px; border-radius: 12px; background: var(--green); display: grid; place-items: center; color: #fff; flex: none; }
.brand-mark svg { width: 24px; height: 24px; }
.brand-text b { display: block; font-size: 16px; line-height: 1.2; }
.brand-text span { font-size: 12px; color: var(--muted); }
.nav a {
  display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px;
  border-radius: 12px; color: var(--ink-2); text-decoration: none; font-weight: 500;
}
.nav a:hover { background: var(--gray-soft); }
.nav a[aria-current="page"] { background: var(--green-soft); color: var(--green-ink); }
.side-foot { margin-top: auto; display: grid; gap: 8px; padding: 8px; font-size: 13px; color: var(--muted); }
.mode-badge { display: inline-flex; align-items: center; gap: 6px; }
.mode-badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.mode-badge.demo::before { background: var(--gold); }

.content { margin-inline-start: var(--side); min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 28px 14px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line-2);
}
.topbar h1 { font-size: 22px; font-weight: 600; margin-inline-end: auto; }
.topbar-actions { display: flex; gap: 8px; }
main { padding: 24px 28px 48px; outline: none; display: grid; gap: 20px; align-content: start; max-width: 1280px; width: 100%; }
.demo-strip {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 28px; background: var(--gold-soft); color: var(--gold-ink); font-size: 14px;
}
.demo-strip .btn { margin-inline-start: auto; }
.tabbar { display: none; }

/* ---------- cartes / panneaux ---------- */
.panel { background: var(--card); border: 1px solid var(--line-2); border-radius: var(--r-l); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.panel-head h2 { font-size: 17px; font-weight: 600; margin-inline-end: auto; }
.count { min-width: 28px; height: 28px; padding: 0 8px; border-radius: 14px; background: var(--gray-soft); display: inline-grid; place-items: center; font-size: 14px; font-weight: 600; }
.link { text-decoration: none; font-size: 14px; font-weight: 500; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.empty { padding: 22px 8px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }

/* ---------- accueil ---------- */
.hero {
  display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap;
  padding: 26px 28px; border-radius: var(--r-l);
  background: var(--green); color: #fff; position: relative; overflow: hidden;
}
.hero::after {
  content: ''; position: absolute; inset-inline-end: -60px; top: -80px; width: 260px; height: 260px;
  border-radius: 50%; border: 36px solid rgba(231, 169, 14, .16); pointer-events: none;
}
.hero-main { margin-inline-end: auto; position: relative; }
.hero-date { font-size: 14px; opacity: .8; }
.hero-label { font-size: 17px; margin-top: 10px; }
.hero-value { font-size: 56px; font-weight: 300; line-height: 1.1; letter-spacing: -.5px; }
.hero-value .cur { font-size: 20px; font-weight: 400; opacity: .85; }
.hero-sub { margin-top: 6px; opacity: .9; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; position: relative; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { background: var(--card); border: 1px solid var(--line-2); border-radius: var(--r); padding: 16px 18px; }
.kpi-label { font-size: 14px; color: var(--muted); }
.kpi-value { font-size: 26px; font-weight: 500; margin-top: 4px; }
.kpi-value small { font-size: 13px; font-weight: 400; color: var(--muted); }
.kpi.neg .kpi-value { color: var(--red); }

.mini-list { display: grid; }
.mini {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
  padding: 12px 4px; border-top: 1px solid var(--line-2);
}
.mini:first-child { border-top: 0; }
.mini-title { font-weight: 500; }
.mini-sub { font-size: 14px; color: var(--muted); }
.mini-actions { grid-row: span 2; display: flex; gap: 6px; }

/* ---------- graphique ---------- */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid line { stroke: var(--line-2); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .bar { fill: var(--chart); }
.chart .bar.today { fill: var(--gold); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .bar.on { opacity: .78; }
.neg-text { color: var(--red); }
.tip {
  position: absolute; pointer-events: none; z-index: 5; transform: translate(-50%, -100%);
  background: var(--ink); color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 13px;
  white-space: nowrap; direction: rtl; box-shadow: 0 6px 20px rgba(0,0,0,.18);
}
.tip b { font-weight: 600; }

/* ---------- filtres ---------- */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  min-height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--line);
  background: var(--card); cursor: pointer; font-size: 14px; color: var(--ink-2);
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 14px; color: var(--ink-2); font-weight: 500; }
.field small { color: var(--muted); font-size: 13px; }
.input, select.input, textarea.input {
  width: 100%; min-height: 46px; padding: 10px 14px;
  border: 1px solid var(--line); border-radius: 12px; background: #fff;
  font-size: 16px; /* évite le zoom iOS */
}
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { border-color: var(--green); outline: none; box-shadow: 0 0 0 3px var(--green-soft); }
.input.compact { min-height: 40px; width: auto; padding: 6px 12px; }
.search { position: relative; flex: 1 1 220px; max-width: 340px; }
.search .input { padding-inline-start: 40px; min-height: 40px; }
.search svg { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.summary { display: flex; gap: 8px 22px; flex-wrap: wrap; font-size: 15px; color: var(--ink-2); }
.summary b { color: var(--ink); font-weight: 600; }

/* ---------- liste des commandes ---------- */
.olist { display: grid; }
.orow {
  display: grid; align-items: center; gap: 4px 14px;
  grid-template-columns: 100px minmax(0, 1.25fr) minmax(0, 1.1fr) 76px 64px 196px;
  grid-template-areas: "ref route people price comm status" "ref route people price comm actions";
  padding: 12px 10px; border-top: 1px solid var(--line-2); cursor: pointer;
}
.c-ref { grid-area: ref; } .c-route { grid-area: route; } .c-people { grid-area: people; }
.c-price { grid-area: price; } .c-comm { grid-area: comm; } .c-status { grid-area: status; justify-self: end; }
.c-actions { grid-area: actions; }
.c-actions:empty { display: none; }
.orow:hover { background: #FAFBFA; }
.orow.head { cursor: default; font-size: 13px; color: var(--muted); border-top: 0; padding-block: 4px 8px; grid-template-areas: none; }
.orow.head span:last-child { text-align: end; }
.orow.head:hover { background: none; }
.c-ref b { display: block; font-weight: 600; }
.c-ref span, .c-people span { display: block; font-size: 14px; color: var(--muted); }
.c-route { font-weight: 500; }
.c-route .arrow { color: var(--muted); margin: 0 4px; }
.c-people a { color: inherit; text-decoration: none; }
.c-price, .c-comm { text-align: end; }
.c-comm { color: var(--green-ink); font-weight: 500; }
.c-actions { display: flex; gap: 6px; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; }
.pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-pending { background: var(--blue-soft); color: var(--blue); }
.st-done { background: var(--green-soft); color: var(--green-ink); }
.st-cancel { background: var(--gray-soft); color: var(--muted); }
.st-cancel::before { background: var(--red); }
.cell-label { display: none; }

/* ---------- chauffeurs ---------- */
.dlist { display: grid; }
.drow {
  display: grid; align-items: center; gap: 6px 18px;
  grid-template-columns: minmax(170px, 1fr) minmax(220px, 1.3fr) minmax(170px, 1fr) auto;
  padding: 14px 10px; border-top: 1px solid var(--line-2); cursor: pointer;
}
.drow:first-child { border-top: 0; }
.drow:hover { background: #FAFBFA; }
.drow.off { opacity: .6; }
.d-id b { display: block; font-weight: 600; }
.d-id span { font-size: 14px; color: var(--muted); }
.d-bal { display: grid; gap: 6px; }
.d-bal-line { display: flex; align-items: baseline; gap: 8px; }
.d-bal-line b { font-size: 20px; font-weight: 500; }
.meter { height: 8px; border-radius: 4px; background: var(--gray-soft); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--gold); }
.meter.low i { background: #D97706; }
.meter.neg i { background: var(--red); width: 100% !important; }
.d-stats { font-size: 14px; color: var(--muted); display: flex; gap: 4px 14px; flex-wrap: wrap; }
.d-actions { display: flex; gap: 6px; justify-content: flex-end; }
.flag { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; padding: 2px 10px; border-radius: 999px; }
.flag.low { background: #FEF0DC; color: #8A4B00; }
.flag.neg { background: var(--red-soft); color: var(--red); }
.flag.off { background: var(--gray-soft); color: var(--muted); }
.flag svg { width: 14px; height: 14px; }

/* ---------- tableaux ---------- */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.t { width: 100%; border-collapse: collapse; font-size: 15px; }
table.t th { text-align: start; font-weight: 500; font-size: 13px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 10px; border-bottom: 1px solid var(--line-2); }
table.t td.n, table.t th.n { text-align: end; white-space: nowrap; }
table.t tfoot td { font-weight: 600; border-top: 2px solid var(--line); border-bottom: 0; }
table.t tr.zero td { color: var(--muted); }
table.t tr.is-today td { background: var(--gold-soft); }

/* ---------- relevé chauffeur ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .spacer { flex: 1; }
.statement { display: grid; gap: 22px; }
.st-head { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
.st-head h2 { font-size: 24px; font-weight: 600; }
.st-head dl { display: grid; grid-template-columns: auto auto; gap: 4px 16px; margin: 0; font-size: 15px; }
.st-head dt { color: var(--muted); }
.st-head dd { margin: 0; font-weight: 500; }
.st-sum { max-width: 520px; }
.st-sum td.n { font-size: 18px; }
.st-sum tfoot td { font-size: 20px; }
.st-sum tfoot td.n.neg { color: var(--red); }
.st-section h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.print-only { display: none; }

/* ---------- formulaires / modales ---------- */
.modal-wrap {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px;
  background: rgba(16, 26, 22, .42); animation: fade .15s ease-out;
}
.modal {
  width: min(640px, 100%); max-height: calc(100vh - 40px); overflow: auto;
  background: var(--card); border-radius: var(--r-l); box-shadow: 0 24px 60px rgba(0,0,0,.25);
  animation: rise .18s ease-out;
}
.modal.wide { width: min(820px, 100%); }
.modal-head { position: sticky; top: 0; background: var(--card); display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line-2); z-index: 1; }
.modal-head h2 { font-size: 19px; font-weight: 600; margin-inline-end: auto; }
.modal-body { padding: 20px; display: grid; gap: 16px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding-top: 4px; }
.modal-wrap.closing { opacity: 0; transition: opacity .15s; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(12px); opacity: .6; } }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.calc {
  display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 12px 16px; border-radius: 12px;
  background: var(--green-soft); color: var(--green-ink); font-size: 15px;
}
.calc b { font-weight: 600; }
.calc.warn { background: var(--red-soft); color: var(--red); }
.seg { display: inline-flex; background: var(--gray-soft); border-radius: 12px; padding: 4px; gap: 4px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg span { display: inline-flex; align-items: center; min-height: 38px; padding: 0 16px; border-radius: 9px; font-size: 15px; cursor: pointer; }
.seg input:checked + span { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 500; }
.seg input:focus-visible + span { outline: 3px solid var(--green-soft); }
.inline-row { display: flex; gap: 8px; align-items: center; }
.inline-row .input { flex: 1; }
.voice-box { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; }
.voice-box audio { width: 100%; max-width: 340px; height: 40px; }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.err { color: var(--red); font-size: 14px; }
.wa-row { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.btn.wa { background: #25D366; border-color: #25D366; color: #06381F; text-decoration: none; }
.btn.wa[aria-disabled="true"] { background: var(--gray-soft); border-color: var(--line); color: var(--muted); pointer-events: none; }
.photo-box { display: grid; gap: 10px; justify-items: start; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; }
.photo-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.cin-thumb { display: block; max-width: 240px; max-height: 160px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: var(--gray-soft); }
.cin-thumb.lg { max-width: 360px; max-height: 240px; cursor: zoom-in; }
.plate { display: inline-block; margin-inline-start: 8px; padding: 0 7px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .3px; }
.confirm-text { font-size: 17px; line-height: 1.7; }

/* ---------- écrans d'accès ---------- */
.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.gate-card { width: min(560px, 100%); background: var(--card); border-radius: var(--r-l); padding: 32px; box-shadow: var(--shadow); display: grid; gap: 18px; }
.gate-card h1 { font-size: 26px; font-weight: 600; }
.gate-card .brand { padding: 0; }
.steps { margin: 0; padding-inline-start: 22px; display: grid; gap: 8px; color: var(--ink-2); font-size: 15px; }
.split { display: grid; gap: 12px; }
.or { text-align: center; color: var(--muted); font-size: 14px; }
.notice { padding: 12px 14px; border-radius: 12px; background: var(--gray-soft); font-size: 14px; color: var(--ink-2); }
.notice.bad { background: var(--red-soft); color: var(--red); }
.loading { display: grid; place-items: center; min-height: 40vh; color: var(--muted); gap: 10px; }

/* ---------- notifications ---------- */
#toasts { position: fixed; bottom: calc(20px + var(--safe-b)); inset-inline: 0; display: grid; justify-items: center; gap: 8px; z-index: 80; pointer-events: none; padding: 0 16px; }
.toast { background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.2); max-width: 560px; animation: rise .18s ease-out; transition: opacity .4s; }
.toast-bad { background: var(--red); }
.toast-warn { background: #8A4B00; }
.toast.out { opacity: 0; }

/* ---------- iPad portrait : rail d'icônes ---------- */
@media (max-width: 1100px) {
  :root { --side: 84px; }
  .side { padding: 18px 10px; align-items: center; }
  .brand { padding: 0 0 14px; }
  .brand-text, .nav a span, .side-foot { display: none; }
  .nav a { flex-direction: column; gap: 2px; justify-content: center; min-height: 60px; width: 64px; padding: 6px 0; font-size: 11px; }
  .nav a span.short { display: block; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .orow { grid-template-columns: 1fr auto; gap: 6px 12px; padding: 14px 8px;
    grid-template-areas: "ref status" "route route" "people people" "price comm" "actions actions"; }
  .orow.head { display: none; }
  .c-people span { display: inline; margin-inline-end: 14px; }
  .c-price, .c-comm { text-align: start; display: inline-flex; gap: 6px; }
  .c-comm { justify-self: end; }
  .cell-label { display: inline; color: var(--muted); font-size: 14px; }
  .c-actions { justify-content: flex-start; }
  .drow { grid-template-columns: 1fr 1fr; }
  .d-stats { grid-column: 1; }
  .d-actions { grid-column: 2; }
}
@media (min-width: 1101px) { .nav a span.short { display: none; } }

/* ---------- téléphone : barre d'onglets ---------- */
@media (max-width: 720px) {
  .side { display: none; }
  .content { margin-inline-start: 0; padding-bottom: calc(70px + var(--safe-b)); }
  .topbar { padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; }
  .topbar h1 { font-size: 19px; }
  .topbar-actions .btn span { display: none; }
  main { padding: 16px 14px 32px; gap: 16px; }
  .demo-strip { padding: 10px 16px; }
  .tabbar {
    display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; inset-inline: 0; bottom: 0; z-index: 30;
    background: var(--card); border-top: 1px solid var(--line); padding-bottom: var(--safe-b);
  }
  .tabbar a { display: grid; justify-items: center; gap: 2px; padding: 8px 0 6px; font-size: 11px; color: var(--muted); text-decoration: none; }
  .tabbar a[aria-current="page"] { color: var(--green); }
  .hero { padding: 20px; }

<script>
const SETUP_SQL = "-- =====================================================================\n--  Delivery Manager — base de données Supabase\n--  À exécuter UNE fois : Supabase → SQL Editor → New query → coller → Run\n--  Le script peut être relancé sans risque (il ne supprime aucune donnée).\n-- =====================================================================\n\n-- ---------------------------------------------------------------------\n-- 1. Paramètres (une seule ligne)\n-- ---------------------------------------------------------------------\ncreate table if not exists public.settings (\n  id               smallint      primary key default 1 check (id = 1),\n  business_name    text          not null default 'Delivery Manager',\n  commission_rate  numeric(6,4)  not null default 0.15 check (commission_rate >= 0 and commission_rate <= 1),\n  low_balance      numeric(14,2) not null default 1000 check (low_balance >= 0),\n  currency         text          not null default 'أوقية',\n  updated_at       timestamptz   not null default now()\n);\ninsert into public.settings (id) values (1) on conflict (id) do nothing;\n\n-- ---------------------------------------------------------------------\n-- 2. Chauffeurs\n-- ---------------------------------------------------------------------\ncreate table if not exists public.drivers (\n  id          uuid        primary key default gen_random_uuid(),\n  phone       text        not null unique check (length(btrim(phone)) > 0),\n  name        text,\n  active      boolean     not null default true,\n  notes       text,\n  created_at  timestamptz not null default now()\n);\nalter table public.drivers add column if not exists cin_number     text;  -- numéro de la carte d'identité (NNI)\nalter table public.drivers add column if not exists plate_number   text;  -- matricule de la moto\nalter table public.drivers add column if not exists cin_photo_path text;  -- photo de la carte (stockage privé)\n\n-- ---------------------------------------------------------------------\n-- 3. Recharges du solde des chauffeurs\n-- ---------------------------------------------------------------------\ncreate table if not exists public.topups (\n  id          uuid          primary key default gen_random_uuid(),\n  driver_id   uuid          not null references public.drivers(id) on delete restrict,\n  amount      numeric(14,2) not null check (amount > 0),\n  method      text,\n  notes       text,\n  topup_at    timestamptz   not null default now(),\n  created_at  timestamptz   not null default now()\n);\ncreate index if not exists topups_driver_idx on public.topups (driver_id);\ncreate index if not exists topups_at_idx     on public.topups (topup_at);\n\n-- ---------------------------------------------------------------------\n-- 4. Commandes de livraison\n--    - commission_rate est figé à la création (copié depuis settings) :\n--      changer le taux plus tard ne modifie pas les anciennes commandes.\n--    - commission n'est due que si la commande est « completed ».\n-- ---------------------------------------------------------------------\ncreate sequence if not exists public.order_ref_seq;\n\ncreate table if not exists public.orders (\n  id               uuid          primary key default gen_random_uuid(),\n  ref              text          not null unique\n                                 default ('T-' || lpad(nextval('public.order_ref_seq')::text, 5, '0')),\n  ordered_at       timestamptz   not null default now(),\n  customer_phone   text          not null,\n  driver_id        uuid          not null references public.drivers(id) on delete restrict,\n  pickup           text          not null,\n  dropoff          text          not null,\n  price            numeric(14,2) not null check (price >= 0),\n  commission_rate  numeric(6,4)  not null check (commission_rate >= 0 and commission_rate <= 1),\n  status           text          not null default 'pending'\n                                 check (status in ('pending', 'completed', 'cancelled')),\n  commission       numeric(14,2) generated always as (\n                     case when status = 'completed' then round(price * commission_rate, 2) else 0 end\n                   ) stored,\n  completed_at     timestamptz,\n  voice_path       text,\n  notes            text,\n  created_at       timestamptz   not null default now()\n);\ncreate index if not exists orders_driver_idx on public.orders (driver_id);\ncreate index if not exists orders_at_idx     on public.orders (ordered_at);\ncreate index if not exists orders_status_idx on public.orders (status);\n\ncreate or replace function public.orders_before_write()\nreturns trigger\nlanguage plpgsql\nset search_path = public\nas $$\nbegin\n  if tg_op = 'INSERT' and new.commission_rate is null then\n    select s.commission_rate into new.commission_rate from public.settings s where s.id = 1;\n  end if;\n\n  if new.status = 'completed' then\n    if tg_op = 'INSERT' or old.status is distinct from 'completed' then\n      new.completed_at := coalesce(new.completed_at, now());\n    end if;\n  else\n    new.completed_at := null;\n  end if;\n\n  return new;\nend;\n$$;\n\ndrop trigger if exists orders_before_write on public.orders;\ncreate trigger orders_before_write\n  before insert or update on public.orders\n  for each row execute function public.orders_before_write();\n\n-- ---------------------------------------------------------------------\n-- 5. Soldes des chauffeurs : solde = recharges − commissions des commandes terminées\n-- ---------------------------------------------------------------------\ncreate or replace view public.driver_balances\nwith (security_invoker = true) as\nselect\n  d.id,\n  d.phone,\n  d.name,\n  d.active,\n  d.notes,\n  d.created_at,\n  coalesce(t.total_topups, 0)::numeric(14,2)                               as total_topups,\n  coalesce(o.total_commission, 0)::numeric(14,2)                           as total_commission,\n  coalesce(o.completed_orders, 0)::int                                     as completed_orders,\n  coalesce(o.pending_orders, 0)::int                                       as pending_orders,\n  (coalesce(t.total_topups, 0) - coalesce(o.total_commission, 0))::numeric(14,2) as balance,\n  t.last_topup_at,\n  d.cin_number,\n  d.plate_number,\n  d.cin_photo_path\nfrom public.drivers d\nleft join (\n  select driver_id, sum(amount) as total_topups, max(topup_at) as last_topup_at\n  from public.topups\n  group by driver_id\n) t on t.driver_id = d.id\nleft join (\n  select driver_id,\n         sum(commission)                                as total_commission,\n         count(*) filter (where status = 'completed')   as completed_orders,\n         count(*) filter (where status = 'pending')     as pending_orders\n  from public.orders\n  group by driver_id\n) o on o.driver_id = d.id;\n\n-- ---------------------------------------------------------------------\n-- 6. Statistiques et rapports (heure de Nouakchott)\n-- ---------------------------------------------------------------------\ncreate or replace function public.dashboard_stats(p_day date)\nreturns json\nlanguage sql\nstable\nsecurity invoker\nset search_path = public\nas $$\n  with o as (\n    select (ordered_at at time zone 'Africa/Nouakchott')::date as d, status, price, commission\n    from public.orders\n  ),\n  t as (\n    select (topup_at at time zone 'Africa/Nouakchott')::date as d, amount\n    from public.topups\n  ),\n  m as (\n    select date_trunc('month', p_day::timestamp)::date                        as m0,\n           (date_trunc('month', p_day::timestamp) + interval '1 month')::date as m1\n  )\n  select json_build_object(\n    'day',              p_day,\n    'today_commission', coalesce((select sum(commission) from o where d = p_day), 0),\n    'today_value',      coalesce((select sum(price) from o where d = p_day and status = 'completed'), 0),\n    'today_completed',  (select count(*) from o where d = p_day and status = 'completed'),\n    'today_pending',    (select count(*) from o where d = p_day and status = 'pending'),\n    'today_cancelled',  (select count(*) from o where d = p_day and status = 'cancelled'),\n    'month_commission', coalesce((select sum(commission) from o, m where d >= m.m0 and d < m.m1), 0),\n    'total_commission', coalesce((select sum(commission) from o), 0),\n    'today_topups',     coalesce((select sum(amount) from t where d = p_day), 0),\n    'total_balance',    coalesce((select sum(balance) from public.driver_balances), 0),\n    'pending_total',    (select count(*) from o where status = 'pending')\n  );\n$$;\n\ncreate or replace function public.daily_report(p_month date)\nreturns table (day date, completed_orders int, orders_value numeric, commission numeric, topups numeric)\nlanguage sql\nstable\nsecurity invoker\nset search_path = public\nas $$\n  with b as (\n    select date_trunc('month', p_month::timestamp)::date                        as m0,\n           (date_trunc('month', p_month::timestamp) + interval '1 month')::date as m1\n  ),\n  days as (\n    select generate_series(b.m0, b.m1 - 1, interval '1 day')::date as day from b\n  ),\n  o as (\n    select (x.ordered_at at time zone 'Africa/Nouakchott')::date        as d,\n           count(*) filter (where x.status = 'completed')               as n,\n           coalesce(sum(x.price) filter (where x.status = 'completed'), 0) as v,\n           coalesce(sum(x.commission), 0)                               as c\n    from public.orders x, b\n    where x.ordered_at >= b.m0::timestamp - interval '1 day'\n      and x.ordered_at <  b.m1::timestamp + interval '1 day'\n    group by 1\n  ),\n  t as (\n    select (y.topup_at at time zone 'Africa/Nouakchott')::date as d, sum(y.amount) as s\n    from public.topups y, b\n    where y.topup_at >= b.m0::timestamp - interval '1 day'\n      and y.topup_at <  b.m1::timestamp + interval '1 day'\n    group by 1\n  )\n  select days.day,\n         coalesce(o.n, 0)::int,\n         coalesce(o.v, 0)::numeric,\n         coalesce(o.c, 0)::numeric,\n         coalesce(t.s, 0)::numeric\n  from days\n  left join o on o.d = days.day\n  left join t on t.d = days.day\n  order by days.day;\n$$;\n\ncreate or replace function public.monthly_report(p_year int)\nreturns table (month int, completed_orders int, orders_value numeric, commission numeric, topups numeric)\nlanguage sql\nstable\nsecurity invoker\nset search_path = public\nas $$\n  with months as (\n    select generate_series(1, 12) as month\n  ),\n  o as (\n    select extract(month from x.ordered_at at time zone 'Africa/Nouakchott')::int as m,\n           count(*) filter (where x.status = 'completed')                         as n,\n           coalesce(sum(x.price) filter (where x.status = 'completed'), 0)        as v,\n           coalesce(sum(x.commission), 0)                                         as c\n    from public.orders x\n    where extract(year from x.ordered_at at time zone 'Africa/Nouakchott')::int = p_year\n    group by 1\n  ),\n  t as (\n    select extract(month from y.topup_at at time zone 'Africa/Nouakchott')::int as m,\n           sum(y.amount) as s\n    from public.topups y\n    where extract(year from y.topup_at at time zone 'Africa/Nouakchott')::int = p_year\n    group by 1\n  )\n  select months.month,\n         coalesce(o.n, 0)::int,\n         coalesce(o.v, 0)::numeric,\n         coalesce(o.c, 0)::numeric,\n         coalesce(t.s, 0)::numeric\n  from months\n  left join o on o.m = months.month\n  left join t on t.m = months.month\n  order by months.month;\n$$;\n\n-- ---------------------------------------------------------------------\n-- 7. Sécurité\n--    Seuls les comptes listés dans app_users ont accès aux données.\n--    Le PREMIER compte créé dans Authentication → Users y est ajouté\n--    automatiquement (le gérant). Tout compte créé ensuite n'a accès à rien.\n-- ---------------------------------------------------------------------\ncreate table if not exists public.app_users (\n  user_id     uuid        primary key,\n  email       text,\n  created_at  timestamptz not null default now()\n);\nalter table public.app_users enable row level security;   -- aucune politique : invisible via l'API\n\ncreate or replace function public.is_app_user()\nreturns boolean\nlanguage sql\nstable\nsecurity definer\nset search_path = public\nas $$\n  select exists (select 1 from public.app_users where user_id = auth.uid());\n$$;\n\ncreate or replace function public.claim_first_user()\nreturns trigger\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\nbegin\n  if not exists (select 1 from public.app_users) then\n    insert into public.app_users (user_id, email) values (new.id, new.email);\n  end if;\n  return new;\nend;\n$$;\n\ndrop trigger if exists dm_claim_first_user on auth.users;\ncreate trigger dm_claim_first_user\n  after insert on auth.users\n  for each row execute function public.claim_first_user();\n\n-- si le compte du gérant existait déjà avant ce script\ninsert into public.app_users (user_id, email)\nselect u.id, u.email from auth.users u\nwhere not exists (select 1 from public.app_users)\norder by u.created_at\nlimit 1;\n\nalter table public.settings enable row level security;\nalter table public.drivers  enable row level security;\nalter table public.topups   enable row level security;\nalter table public.orders   enable row level security;\n\ndrop policy if exists \"settings_read\"   on public.settings;\ndrop policy if exists \"settings_update\" on public.settings;\ncreate policy \"settings_read\"   on public.settings for select to authenticated using (public.is_app_user());\ncreate policy \"settings_update\" on public.settings for update to authenticated using (public.is_app_user()) with check (id = 1 and public.is_app_user());\n\ndrop policy if exists \"drivers_all\" on public.drivers;\ncreate policy \"drivers_all\" on public.drivers for all to authenticated using (public.is_app_user()) with check (public.is_app_user());\n\ndrop policy if exists \"topups_all\" on public.topups;\ncreate policy \"topups_all\" on public.topups for all to authenticated using (public.is_app_user()) with check (public.is_app_user());\n\ndrop policy if exists \"orders_all\" on public.orders;\ncreate policy \"orders_all\" on public.orders for all to authenticated using (public.is_app_user()) with check (public.is_app_user());\n\nrevoke all on public.settings, public.drivers, public.topups, public.orders, public.driver_balances, public.app_users from anon;\nrevoke all on public.app_users from authenticated;\ngrant select, update                 on public.settings        to authenticated;\ngrant select, insert, update, delete on public.drivers         to authenticated;\ngrant select, insert, update, delete on public.topups          to authenticated;\ngrant select, insert, update, delete on public.orders          to authenticated;\ngrant select                         on public.driver_balances to authenticated;\ngrant usage, select on sequence public.order_ref_seq           to authenticated;\n\nrevoke execute on function public.dashboard_stats(date) from public, anon;\nrevoke execute on function public.daily_report(date)    from public, anon;\nrevoke execute on function public.monthly_report(int)   from public, anon;\ngrant  execute on function public.dashboard_stats(date) to authenticated;\ngrant  execute on function public.daily_report(date)    to authenticated;\ngrant  execute on function public.monthly_report(int)   to authenticated;\nrevoke execute on function public.is_app_user()       from public, anon;\ngrant  execute on function public.is_app_user()       to authenticated;\nrevoke execute on function public.claim_first_user()  from public, anon, authenticated;\n\n-- ---------------------------------------------------------------------\n-- 8. Stockage des messages vocaux (privé)\n-- ---------------------------------------------------------------------\ninsert into storage.buckets (id, name, public, file_size_limit)\nvalues ('voice', 'voice', false, 15728640)\non conflict (id) do nothing;\n\ndrop policy if exists \"voice_read\"   on storage.objects;\ndrop policy if exists \"voice_insert\" on storage.objects;\ndrop policy if exists \"voice_update\" on storage.objects;\ndrop policy if exists \"voice_delete\" on storage.objects;\ncreate policy \"voice_read\"   on storage.objects for select to authenticated using (bucket_id = 'voice' and public.is_app_user());\ncreate policy \"voice_insert\" on storage.objects for insert to authenticated with check (bucket_id = 'voice' and public.is_app_user());\ncreate policy \"voice_update\" on storage.objects for update to authenticated using (bucket_id = 'voice' and public.is_app_user()) with check (bucket_id = 'voice' and public.is_app_user());\ncreate policy \"voice_delete\" on storage.objects for delete to authenticated using (bucket_id = 'voice' and public.is_app_user());\n\n-- ---------------------------------------------------------------------\n-- 9. Photos des cartes d'identité des chauffeurs (privé)\n-- ---------------------------------------------------------------------\ninsert into storage.buckets (id, name, public, file_size_limit)\nvalues ('driver-docs', 'driver-docs', false, 10485760)\non conflict (id) do nothing;\n\ndrop policy if exists \"docs_read\"   on storage.objects;\ndrop policy if exists \"docs_insert\" on storage.objects;\ndrop policy if exists \"docs_update\" on storage.objects;\ndrop policy if exists \"docs_delete\" on storage.objects;\ncreate policy \"docs_read\"   on storage.objects for select to authenticated using (bucket_id = 'driver-docs' and public.is_app_user());\ncreate policy \"docs_insert\" on storage.objects for insert to authenticated with check (bucket_id = 'driver-docs' and public.is_app_user());\ncreate policy \"docs_update\" on storage.objects for update to authenticated using (bucket_id = 'driver-docs' and public.is_app_user()) with check (bucket_id = 'driver-docs' and public.is_app_user());\ncreate policy \"docs_delete\" on storage.objects for delete to authenticated using (bucket_id = 'driver-docs' and public.is_app_user());\n\n-- Fin. Ensuite : Authentication → Users → Add user (le compte du gérant, « Auto Confirm »).\n-- Pour donner accès à un 2e compte plus tard :\n--   insert into public.app_users (user_id, email)\n--   select id, email from auth.users where email = 'adresse@exemple.com';\n";

/* ---------- stockage local (protégé) ---------- */
const memStore = {};
const local = {
  get(k, d = null) {
    try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) { /* ignoré */ }
    return k in memStore ? memStore[k] : d;
  },
  set(k, v) { memStore[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignoré */ } },
  del(k) { delete memStore[k]; try { localStorage.removeItem(k); } catch (e) { /* ignoré */ } },
};

/* ---------- utilitaires ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const round2 = (v) => Math.round(num(v) * 100) / 100;
const NF = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });

const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = (s) => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());

const monthStart = (s) => String(s).slice(0, 7) + '-01';
const nextMonth = (s) => { const d = parseYmd(monthStart(s)); d.setMonth(d.getMonth() + 1); return ymd(d); };
const localDay = (iso) => ymd(new Date(iso));
const dayStartISO = (s) => parseYmd(s).toISOString();
const fmtDate = (v) => {
  const d = v instanceof Date ? v : (String(v).length === 10 ? parseYmd(v) : new Date(v));
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
};
const fmtShort = (v) => { const d = new Date(v); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const fmtTime = (v) => { const d = new Date(v); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

const monthName = (s) => `${MONTHS[parseYmd(monthStart(s)).getMonth()]} ${String(s).slice(0, 4)}`;
const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID()

const pick = (o, keys) => Object.fromEntries(keys.filter((k) => o[k] !== undefined).map((k) => [k, o[k]]));
const cleanPhone = (v) => String(v || '').replace(/[^\d+]/g, '');
/* Numéro au format international pour wa.me (Mauritanie : 8 chiffres → 222XXXXXXXX). */
const waNumber = (v) => {
  let d = String(v || '').replace(/[^\d+]/g, '');
  if (d.startsWith('+')) d = d.slice(1); else if (d.startsWith('00')) d = d.slice(2);
  d = d.replace(/\D/g, '');
  if (d.length === 8) d = '222' + d;
  return d.length >= 10 ? d : '';
};
const debounce = (fn, ms = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---------- interface : notifications et fenêtres ---------- */
function toast(msg, kind = 'ok') {
  const el = document.createElement('div');
  el.className = `toast toast-${kind}`;
  el.setAttribute('role', 'status');
  el.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('out'), kind === 'bad' ? 5200 : 3200);
  setTimeout(() => el.remove(), kind === 'bad' ? 5700 : 3700);
}

function showModal({ title, html, wide = false, onMount }) {
  return new Promise((resolve) => {
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <header class="modal-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="إغلاق">${ic('x')}</button></header>
      <div class="modal-body">${html}</div></div>`;
    const prevFocus = document.activeElement;
    let done = false;
    const close = (val = null) => {
      if (done) return; done = true;
      document.removeEventListener('keydown', onKey);
      wrap.classList.add('closing');
      setTimeout(() => wrap.remove(), 150);
      if (prevFocus && prevFocus.focus) try { prevFocus.focus({ preventScroll: true }); } catch (e) { /* ignoré */ }
      resolve(val);
    };
    const onKey = (e) => { if (e.key === 'Escape' && wrap === $$('.modal-wrap').pop()) close(null); };
    document.addEventListener('keydown', onKey);
    wrap.addEventListener('click', (e) => {
      if (e.target === wrap || e.target.closest('[data-close]')) close(null);
    });
    document.body.append(wrap);
    const modal = $('.modal', wrap);
    onMount && onMount(modal, close);
    const first = $('input:not([type=hidden]):not([type=radio]), select, textarea', modal);
    if (first && !('ontouchstart' in window)) first.focus();
  });
}

function confirmBox(text, { ok = 'تأكيد', danger = false, title = 'تأكيد' } = {}) {
  return showModal({
    title,
    html: `<p class="confirm-text">${esc(text)}</p>
      <div class="modal-actions"><button type="button" class="btn ghost" data-close>رجوع</button>
      <button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(ok)}</button></div>`,
    onMount: (m, close) => { $('[data-ok]', m).onclick = () => close(true); },
  }).then((v) => v === true);
}

function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${label ? ' ' + esc(label) : ''}`; }
  else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
}

function errMsg(e) {
  const code = String((e && e.code) || '');
  const m = String((e && (e.message || e.error_description)) || e || '').toLowerCase();
  if (code === '23505' || m.includes('duplicate')) return 'هذا الرقم مسجل مسبقاً.';
  if (code === 'PGRST116') return 'العنصر غير موجود أو لا تملك صلاحية الوصول إليه.';
  if (code === '23503' || m.includes('foreign key') || m.includes('violates restrict'))
    return 'لا يمكن الحذف لأن لهذا السائق طلبات أو شحنات مسجلة. يمكنك إيقافه بدلاً من ذلك.';
  if (m.includes('invalid login') || m.includes('invalid credentials')) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
  if (m.includes('email not confirmed')) return 'البريد الإلكتروني غير مؤكد. فعّل خيار Auto Confirm عند إنشاء المستخدم في Supabase.';
  if (m.includes('failed to fetch') || m.includes('networkerror') || m.includes('load failed') || m.includes('network request failed'))
    return 'تعذر الاتصال بالخادم. تحقق من الإنترنت ثم أعد المحاولة.';
  if (m.includes('jwt') || code === 'PGRST301') return 'انتهت الجلسة. سجّل الدخول من جديد.';
  if (code === '42P01' || code === '42883' || code === 'PGRST202' || code === 'PGRST205' || m.includes('does not exist') || m.includes('could not find'))
    return 'قاعدة البيانات غير مهيأة بعد. انسخ كود الإعداد وشغّله في Supabase (SQL Editor).';
  if (code === '42501' || m.includes('permission denied') || m.includes('row-level security'))
    return 'ليست لديك صلاحية لهذه العملية. سجّل الدخول بحساب المسير.';
  if (m.includes('bucket not found')) return 'مساحة حفظ الملفات غير موجودة. شغّل كود التحديث في Supabase (SQL Editor).';
  if (m.includes('payload too large') || m.includes('exceeded the maximum')) return 'الملف الصوتي كبير جداً (الحد 15 ميغابايت).';
  return 'حدث خطأ: ' + ((e && e.message) || e);
}

function downloadCSV(filename, rows) {
  if (DEMO_BUILD) { toast('التصدير متاح في النسخة الكاملة من التطبيق.', 'warn'); return; }
  const cell = (v) => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '﻿' + rows.map((r) => r.map(cell).join(',')).join('\r\n');
  try {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.append(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('تم تجهيز ملف ' + filename);
  } catch (e) {
    toast('التنزيل غير متاح على هذا الجهاز.', 'warn');
  }
}

function printPage() {
  if (DEMO_BUILD) { toast('الطباعة متاحة في النسخة الكاملة من التطبيق.', 'warn'); return; }
  try { window.print(); } catch (e) { toast('الطباعة غير متاحة هنا.', 'warn'); }
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = resolve;
    s.onerror = () => reject(new Error('failed to fetch ' + src));
    document.head.append(s);
  });
}

/* Réduit une photo (souvent 3 à 5 Mo sur iPhone) à environ 300 Ko en JPEG. */
async function compressImage(file, max = 1600, quality = 0.82) {
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, max / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
    const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', quality));
    return blob ? new File([blob], 'cin.jpg', { type: 'image/jpeg' }) : file;
  } catch (e) { return file; }
}

/* =====================================================================
   COUCHE DE DONNÉES
   Les deux implémentations exposent exactement les mêmes méthodes.
   ===================================================================== */
const ORDER_SELECT = '*, driver:drivers(id, phone, name)';
const ORDER_FIELDS = ['ordered_at', 'customer_phone', 'driver_id', 'pickup', 'dropoff', 'price', 'status', 'voice_path', 'notes'];

class CloudAPI {
  constructor(url, key) {
    this.mode = 'cloud';
    this.url = url;
    this.sb = window.supabase.createClient(url, key, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: 'dm.auth' },
    });
  }
  async run(p) { const { data, error } = await p; if (error) throw error; return data; }
  async session() { const { data, error } = await this.sb.auth.getSession(); if (error) throw error; return data.session; }
  async signIn(email, password) { const { error } = await this.sb.auth.signInWithPassword({ email, password }); if (error) throw error; }
  async signOut() { await this.sb.auth.signOut(); }
  onAuthLost(cb) { this.sb.auth.onAuthStateChange((ev, s) => { if (ev === 'SIGNED_OUT' || (!s && ev !== 'INITIAL_SESSION')) cb(); }); }

  getSettings() { return this.run(this.sb.from('settings').select('*').eq('id', 1).single()); }
  saveSettings(p) {
    return this.run(this.sb.from('settings').update({ ...p, updated_at: new Date().toISOString() }).eq('id', 1).select().single());
  }

  listDrivers() { return this.run(this.sb.from('driver_balances').select('*').order('created_at', { ascending: true })); }
  getDriver(id) { return this.run(this.sb.from('driver_balances').select('*').eq('id', id).single()); }
  saveDriver(d) {
    const row = {
      phone: cleanPhone(d.phone), name: d.name || null, notes: d.notes || null, active: d.active !== false,
      cin_number: d.cin_number || null, plate_number: d.plate_number || null, cin_photo_path: d.cin_photo_path || null,
    };
    return d.id ? this.run(this.sb.from('drivers').update(row).eq('id', d.id).select().single())
      : this.run(this.sb.from('drivers').insert(row).select().single());
  }
  deleteDriver(id) { return this.run(this.sb.from('drivers').delete().eq('id', id)); }

  listOrders({ from, to, status, driverId, limit = 2000 } = {}) {
    let q = this.sb.from('orders').select(ORDER_SELECT).order('ordered_at', { ascending: false }).limit(limit);
    if (from) q = q.gte('ordered_at', dayStartISO(from));
    if (to) q = q.lt('ordered_at', dayStartISO(addDays(to, 1)));
    if (status) q = q.eq('status', status);
    if (driverId) q = q.eq('driver_id', driverId);
    return this.run(q);
  }
  saveOrder(o) {
    const row = pick(o, ORDER_FIELDS);
    return o.id ? this.run(this.sb.from('orders').update(row).eq('id', o.id).select(ORDER_SELECT).single())
      : this.run(this.sb.from('orders').insert(row).select(ORDER_SELECT).single());
  }
  setOrderStatus(id, status) { return this.saveOrder({ id, status }); }
  deleteOrder(id) { return this.run(this.sb.from('orders').delete().eq('id', id)); }

  listTopups({ from, to, driverId, limit = 2000 } = {}) {
    let q = this.sb.from('topups').select('*, driver:drivers(id, phone, name)').order('topup_at', { ascending: false }).limit(limit);
    if (from) q = q.gte('topup_at', dayStartISO(from));
    if (to) q = q.lt('topup_at', dayStartISO(addDays(to, 1)));
    if (driverId) q = q.eq('driver_id', driverId);
    return this.run(q);
  }
  saveTopup(t) {
    const row = pick(t, ['driver_id', 'amount', 'method', 'notes', 'topup_at']);
    return t.id ? this.run(this.sb.from('topups').update(row).eq('id', t.id).select().single())
      : this.run(this.sb.from('topups').insert(row).select().single());
  }
  deleteTopup(id) { return this.run(this.sb.from('topups').delete().eq('id', id)); }

  stats(day) { return this.run(this.sb.rpc('dashboard_stats', { p_day: day })); }
  daily(month) { return this.run(this.sb.rpc('daily_report', { p_month: monthStart(month) })); }
  monthly(year) { return this.run(this.sb.rpc('monthly_report', { p_year: Number(year) })); }

  async uploadVoice(file) {
    const ext = voiceExt(file);
    const d = new Date();
    const path = `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${uid()}.${ext}`;
    const { error } = await this.sb.storage.from('voice').upload(path, file, { contentType: file.type || 'audio/mp4', upsert: false });
    if (error) throw error;
    return path;
  }
  async voiceUrl(path) {
    const { data, error } = await this.sb.storage.from('voice').createSignedUrl(path, 3600);
    if (error) throw error;
    return data.signedUrl;
  }
  async deleteVoice(path) { try { await this.sb.storage.from('voice').remove([path]); } catch (e) { /* ignoré */ } }

  async uploadDoc(file) {
    const ext = (file.type || '').includes('png') ? 'png' : (file.type || '').includes('heic') ? 'heic' : 'jpg';
    const path = `cin/${uid()}.${ext}`;
    const { error } = await this.sb.storage.from(DOC_BUCKET).upload(path, file, { contentType: file.type || 'image/jpeg', upsert: false });
    if (error) throw error;
    return path;
  }
  async docUrl(path) {
    const { data, error } = await this.sb.storage.from(DOC_BUCKET).createSignedUrl(path, 3600);
    if (error) throw error;
    return data.signedUrl;
  }
  async deleteDoc(path) { try { await this.sb.storage.from(DOC_BUCKET).remove([path]); } catch (e) { /* ignoré */ } }
}

function voiceExt(file) {
  const n = (file.name || '').toLowerCase();
  const m = n.match(/\.([a-z0-9]{2,5})$/);
  if (m) return m[1];
  const t = (file.type || '').toLowerCase();
  if (t.includes('mp4') || t.includes('m4a') || t.includes('aac')) return 'm4a';
  if (t.includes('webm')) return 'webm';
  if (t.includes('ogg') || t.includes('opus')) return 'ogg';
  if (t.includes('mpeg') || t.includes('mp3')) return 'mp3';
  if (t.includes('wav')) return 'wav';
  return 'audio';
}

/* ---------- mode démo : mêmes règles que la base Supabase ---------- */
class DemoAPI {
  constructor() {
    this.mode = 'demo';
    this.voices = {};
    this.docs = {};
    this.db = local.get('dm.demo');
    if (!this.db || !Array.isArray(this.db.orders)) { this.db = seedDemo(); this.save(); }
  }
  save() { local.set('dm.demo', this.db); }
  reset() { this.db = seedDemo(); this.save(); }
  async session() { return { user: { email: 'demo' } }; }
  async signIn() { }
  async signOut() { }
  onAuthLost() { }
  _comm(o) { return o.status === 'completed' ? round2(num(o.price) * num(o.commission_rate)) : 0; }
  _drv(id) { return this.db.drivers.find((d) => d.id === id); }
  _order(o) { const d = this._drv(o.driver_id); return { ...o, commission: this._comm(o), driver: d ? { id: d.id, phone: d.phone, name: d.name } : null }; }
  _bal(d) {
    const tops = this.db.topups.filter((t) => t.driver_id === d.id);
    const ords = this.db.orders.filter((o) => o.driver_id === d.id);
    const total_topups = round2(tops.reduce((s, t) => s + num(t.amount), 0));
    const total_commission = round2(ords.reduce((s, o) => s + this._comm(o), 0));
    return {
      ...d, total_topups, total_commission,
      completed_orders: ords.filter((o) => o.status === 'completed').length,
      pending_orders: ords.filter((o) => o.status === 'pending').length,
      balance: round2(total_topups - total_commission),
      last_topup_at: tops.reduce((m, t) => (!m || t.topup_at > m ? t.topup_at : m), null),
    };
  }
  _inRange(iso, from, to) { const d = localDay(iso); return (!from || d >= from) && (!to || d <= to); }

  async getSettings() { return { ...this.db.settings }; }
  async saveSettings(p) { Object.assign(this.db.settings, p); this.save(); return { ...this.db.settings }; }

  async listDrivers() { return this.db.drivers.map((d) => this._bal(d)); }
  async getDriver(id) { const d = this._drv(id); if (!d) throw new Error('not found'); return this._bal(d); }
  async saveDriver(d) {
    const phone = cleanPhone(d.phone);
    if (this.db.drivers.some((x) => x.phone === phone && x.id !== d.id)) throw { code: '23505', message: 'duplicate' };
    const extra = { cin_number: d.cin_number || null, plate_number: d.plate_number || null, cin_photo_path: d.cin_photo_path || null };
    if (d.id) { Object.assign(this._drv(d.id), { phone, name: d.name || null, notes: d.notes || null, active: d.active !== false, ...extra }); this.save(); return this._drv(d.id); }
    const row = { id: uid(), phone, name: d.name || null, notes: d.notes || null, active: true, ...extra, created_at: new Date().toISOString() };
    this.db.drivers.push(row); this.save(); return row;
  }
  async deleteDriver(id) {
    if (this.db.orders.some((o) => o.driver_id === id) || this.db.topups.some((t) => t.driver_id === id)) throw { code: '23503', message: 'restrict' };
    this.db.drivers = this.db.drivers.filter((d) => d.id !== id); this.save();
  }

  async listOrders({ from, to, status, driverId, limit = 2000 } = {}) {
    return this.db.orders
      .filter((o) => this._inRange(o.ordered_at, from, to) && (!status || o.status === status) && (!driverId || o.driver_id === driverId))
      .sort((a, b) => (a.ordered_at < b.ordered_at ? 1 : -1))
      .slice(0, limit)
      .map((o) => this._order(o));
  }
  async saveOrder(o) {
    const row = pick(o, ORDER_FIELDS);
    if (o.id) {
      const cur = this.db.orders.find((x) => x.id === o.id);
      if (!cur) throw new Error('not found');
      const wasDone = cur.status === 'completed';
      Object.assign(cur, row);
      if (cur.status === 'completed') { if (!wasDone) cur.completed_at = new Date().toISOString(); } else cur.completed_at = null;
      this.save(); return this._order(cur);
    }
    this.db.seq = (this.db.seq || 0) + 1;
    const now = new Date().toISOString();
    const rec = {
      id: uid(), ref: 'T-' + String(this.db.seq).padStart(5, '0'), ordered_at: now, status: 'pending',
      voice_path: null, notes: null, ...row,
      commission_rate: num(this.db.settings.commission_rate), created_at: now, completed_at: null,
    };
    if (rec.status === 'completed') rec.completed_at = now;
    this.db.orders.push(rec); this.save(); return this._order(rec);
  }
  setOrderStatus(id, status) { return this.saveOrder({ id, status }); }
  async deleteOrder(id) { this.db.orders = this.db.orders.filter((o) => o.id !== id); this.save(); }

  async listTopups({ from, to, driverId, limit = 2000 } = {}) {
    return this.db.topups
      .filter((t) => this._inRange(t.topup_at, from, to) && (!driverId || t.driver_id === driverId))
      .sort((a, b) => (a.topup_at < b.topup_at ? 1 : -1))
      .slice(0, limit)
      .map((t) => { const d = this._drv(t.driver_id); return { ...t, driver: d ? { id: d.id, phone: d.phone, name: d.name } : null }; });
  }
  async saveTopup(t) {
    if (!(num(t.amount) > 0)) throw new Error('amount');
    if (t.id) { Object.assign(this.db.topups.find((x) => x.id === t.id), pick(t, ['driver_id', 'amount', 'method', 'notes', 'topup_at'])); this.save(); return t; }
    const row = { id: uid(), method: null, notes: null, topup_at: new Date().toISOString(), ...pick(t, ['driver_id', 'amount', 'method', 'notes', 'topup_at']), created_at: new Date().toISOString() };
    this.db.topups.push(row); this.save(); return row;
  }
  async deleteTopup(id) { this.db.topups = this.db.topups.filter((t) => t.id !== id); this.save(); }

  async stats(day) {
    const o = this.db.orders.map((x) => ({ d: localDay(x.ordered_at), st: x.status, price: num(x.price), c: this._comm(x) }));
    const t = this.db.topups.map((x) => ({ d: localDay(x.topup_at), a: num(x.amount) }));
    const m0 = monthStart(day), m1 = nextMonth(day);
    const sum = (arr, f) => round2(arr.reduce((s, x) => s + f(x), 0));
    const drivers = await this.listDrivers();
    return {
      day,
      today_commission: sum(o.filter((x) => x.d === day), (x) => x.c),
      today_value: sum(o.filter((x) => x.d === day && x.st === 'completed'), (x) => x.price),
      today_completed: o.filter((x) => x.d === day && x.st === 'completed').length,
      today_pending: o.filter((x) => x.d === day && x.st === 'pending').length,
      today_cancelled: o.filter((x) => x.d === day && x.st === 'cancelled').length,
      month_commission: sum(o.filter((x) => x.d >= m0 && x.d < m1), (x) => x.c),
      total_commission: sum(o, (x) => x.c),
      today_topups: sum(t.filter((x) => x.d === day), (x) => x.a),
      total_balance: sum(drivers, (d) => num(d.balance)),
      pending_total: o.filter((x) => x.st === 'pending').length,
    };
  }
  async daily(month) {
    const rows = []; const m1 = nextMonth(month);
    for (let d = monthStart(month); d < m1; d = addDays(d, 1)) rows.push({ day: d, completed_orders: 0, orders_value: 0, commission: 0, topups: 0 });
    const idx = Object.fromEntries(rows.map((r) => [r.day, r]));
    this.db.orders.forEach((o) => {
      const r = idx[localDay(o.ordered_at)]; if (!r) return;
      if (o.status === 'completed') { r.completed_orders++; r.orders_value = round2(r.orders_value + num(o.price)); }
      r.commission = round2(r.commission + this._comm(o));
    });
    this.db.topups.forEach((t) => { const r = idx[localDay(t.topup_at)]; if (r) r.topups = round2(r.topups + num(t.amount)); });
    return rows;
  }
  async monthly(year) {
    const rows = Array.from({ length: 12 }, (_, i) => ({ month: i + 1, completed_orders: 0, orders_value: 0, commission: 0, topups: 0 }));
    this.db.orders.forEach((o) => {
      const d = new Date(o.ordered_at); if (d.getFullYear() !== Number(year)) return;
      const r = rows[d.getMonth()];
      if (o.status === 'completed') { r.completed_orders++; r.orders_value = round2(r.orders_value + num(o.price)); }
      r.commission = round2(r.commission + this._comm(o));
    });
    this.db.topups.forEach((t) => { const d = new Date(t.topup_at); if (d.getFullYear() === Number(year)) rows[d.getMonth()].topups = round2(rows[d.getMonth()].topups + num(t.amount)); });
    return rows;
  }

  async uploadVoice(file) { const id = uid(); this.voices[id] = URL.createObjectURL(file); return 'demo/' + id; }
  async voiceUrl(path) { return this.voices[String(path).split('/').pop()] || null; }
  async deleteVoice() { }
  async uploadDoc(file) { const id = uid(); this.docs[id] = URL.createObjectURL(file); return 'demo/' + id; }
  async docUrl(path) { return this.docs[String(path).split('/').pop()] || null; }
  async deleteDoc() { }
}

function seedDemo() {
  let s = 20261121;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const choose = (a) => a[Math.floor(rnd() * a.length)];
  const now = new Date();
  const at = (daysAgo, h, m) => { const d = new Date(now); d.setDate(d.getDate() - daysAgo); d.setHours(h, m, 0, 0); return d; };
  const drivers = [
    ['44112233', 'سيدي محمد', '1234567801', '2235 MA 00'], ['33445566', 'أحمد سالم', '1234567802', '4410 MB 00'],
    ['22778899', 'محمد الأمين', '1234567803', '1876 MA 00'], ['46123456', 'الشيخ ولد أحمد', '1234567804', '3092 MC 00'],
  ].map(([phone, name, cin, plate]) => ({ id: uid(), phone, name, cin_number: cin, plate_number: plate, cin_photo_path: null, active: true, notes: null, created_at: at(20, 9, 0).toISOString() }));
  const topups = [];
  const addTop = (di, daysAgo, amount, method) => topups.push({ id: uid(), driver_id: drivers[di].id, amount, method, notes: null, topup_at: at(daysAgo, 8, 10 + topups.length).toISOString(), created_at: at(daysAgo, 8, 10).toISOString() });
  addTop(0, 13, 10000, 'نقداً'); addTop(1, 13, 8000, 'Bankily'); addTop(2, 12, 6000, 'Masrvi'); addTop(3, 12, 4000, 'نقداً');
  addTop(0, 6, 8000, 'Bankily'); addTop(1, 5, 6000, 'نقداً'); addTop(2, 7, 6000, 'Masrvi'); addTop(3, 5, 1000, 'نقداً'); addTop(2, 0, 3000, 'Bankily');
  const places = ['تفرغ زينة', 'لكصر', 'عرفات', 'توجنين', 'دار النعيم', 'الميناء', 'السبخة', 'تيارت', 'الرياض', 'سوق العاصمة', 'كارفور', 'المستشفى الوطني'];
  const prices = [1500, 2000, 2000, 2500, 2500, 3000, 3500, 4000, 4500, 5000];
  const raw = [];
  for (let day = 13; day >= 1; day--) {
    const n = 3 + Math.floor(rnd() * 5);
    for (let k = 0; k < n; k++) {
      const di = rnd() < 0.15 ? 3 : Math.floor(rnd() * 3);
      const r = rnd();
      raw.push({ when: at(day, 8 + Math.floor(rnd() * 13), Math.floor(rnd() * 60)), di, status: r < 0.08 ? 'cancelled' : 'completed' });
    }
  }
  for (let k = 6; k >= 1; k--) {
    const when = new Date(now.getTime() - k * 52 * 60000);
    if (localDay(when.toISOString()) !== ymd(now)) continue;
    raw.push({ when, di: k % 3, status: k <= 2 ? 'pending' : 'completed' });
  }
  raw.sort((a, b) => a.when - b.when);
  const orders = raw.map((x, i) => {
    let from = choose(places), to = choose(places);
    if (to === from) to = places[(places.indexOf(from) + 3) % places.length];
    const iso = x.when.toISOString();
    return {
      id: uid(), ref: 'T-' + String(i + 1).padStart(5, '0'), ordered_at: iso,
      customer_phone: choose(['2', '3', '4']) + String(Math.floor(1000000 + rnd() * 8999999)),
      driver_id: drivers[x.di].id, pickup: from, dropoff: to, price: choose(prices), commission_rate: 0.15,
      status: x.status, completed_at: x.status === 'completed' ? iso : null, voice_path: null,
      notes: x.status === 'cancelled' ? 'ألغى الزبون الطلب' : null, created_at: iso,
    };
  });
  return {
    settings: { id: 1, business_name: 'Delivery Manager', commission_rate: 0.15, low_balance: 1000, currency: 'أوقية' },
    drivers, topups, orders, seq: orders.length,
  };
}

function periodRange(f) {
  const t = today();
  switch (f.period) {
    case 'today': return [t, t];
    case 'yesterday': return [addDays(t, -1), addDays(t, -1)];
    case 'week': return [addDays(t, -6), t];

/* ---------- graphique en barres ---------- */
function niceMax(v) {
  if (v <= 0) return 100;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const m = v / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}
function barChart(rows, key = 'commission') {
  const id = 'c' + Math.random().toString(36).slice(2, 9);
  app.charts[id] = rows;
  const W = 760, H = 220, L = 52, R = 8, T = 12, B = 28;
  const n = rows.length || 1;
  const vals = rows.map((r) => num(r[key]));
  const max = niceMax(Math.max(0, ...vals));
  const pw = W - L - R, ph = H - T - B, step = pw / n, bw = Math.max(4, Math.min(20, step - 3));
  const base = T + ph;
  const t = today();
  const grid = [0, 0.5, 1].map((f) => {
    const y = base - f * ph;
    return `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${NF.format(max * f)}</text>`;
  }).join('');
  const bars = rows.map((r, i) => {
    const v = num(r[key]); if (v <= 0) return '';
    const h = (v / max) * ph, x = L + i * step + (step - bw) / 2, y = base - h, rr = Math.min(4, bw / 2, h);
    return `<path class="bar ${r.day === t ? 'today' : ''}" data-i="${i}" d="M${x},${base}V${y + rr}Q${x},${y} ${x + rr},${y}H${x + bw - rr}Q${x + bw},${y} ${x + bw},${y + rr}V${base}Z"/>`;
  }).join('');
  const labels = rows.map((r, i) => {
    const day = Number(String(r.day).slice(8, 10));
    if (!(day === 1 || day % 5 === 0)) return '';
    return `<text x="${L + i * step + step / 2}" y="${H - 8}" text-anchor="middle">${day}</text>`;
  }).join('');
  const hits = rows.map((r, i) => `<rect class="hit" data-i="${i}" x="${L + i * step}" y="${T}" width="${step}" height="${ph}"/>`).join('');
  const total = sumOf(rows, key);
  return `<div class="chart" dir="ltr" data-chart="${id}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="العمولة اليومية، المجموع ${money(total)} ${cur()}">
      <g class="grid axis">${grid}</g><g>${bars}</g><g class="axis">${labels}</g><g>${hits}</g></svg>
    <div class="tip" hidden></div></div>`;
}
function bindCharts(root) {
  $$('.chart', root).forEach((ch) => {
    const rows = app.charts[ch.dataset.chart] || [];
    const tip = $('.tip', ch), svg = $('svg', ch);
    const show = (e) => {
      const hit = e.target.closest && e.target.closest('.hit'); if (!hit) return;
      const i = Number(hit.dataset.i), r = rows[i]; if (!r) return;
      $$('.bar', ch).forEach((b) => b.classList.toggle('on', b.dataset.i === String(i)));
      tip.innerHTML = `<b>${WEEKDAYS[parseYmd(r.day).getDay()]} ${fmtDate(r.day)}</b><br>أرباحك: ${money(r.commission)} ${cur()}<br>طلبات مكتملة: ${num(r.completed_orders)}`;
      tip.hidden = false;
      const box = svg.getBoundingClientRect();
      const bar = $(`.bar[data-i="${i}"]`, ch);
      const hb = hit.getBoundingClientRect();
      const top = bar ? bar.getBoundingClientRect().top : hb.bottom;
      const x = Math.max(80, Math.min(box.width - 80, hb.left + hb.width / 2 - box.left));
      tip.style.left = x + 'px';
      tip.style.top = (top - box.top - 6) + 'px';
    };
    ch.addEventListener('pointerover', show);
    ch.addEventListener('pointerdown', show);
    ch.addEventListener('pointerleave', () => { tip.hidden = true; $$('.bar.on', ch).forEach((b) => b.classList.remove('on')); });
  });
}

/* ---------- commandes ---------- */
async function viewOrders(seq) {
  const f = app.f.orders;
  const [from, to] = periodRange(f);
  const key = JSON.stringify([from, to, f.status, f.driverId]);
  let rows;
  if (app.cacheOK && app.cache.ordersKey === key) rows = app.cache.orders;
  else {
    [rows] = await Promise.all([app.api.listOrders({ from, to, status: f.status, driverId: f.driverId }), app.drivers.length ? null : loadDrivers()]);
    app.cache.orders = rows; app.cache.ordersKey = key;
  }
  app.cacheOK = false;
  indexOrders(rows);
  const q = f.q.trim().toLowerCase();
  const list = q ? rows.filter((o) => [o.ref, o.customer_phone, o.pickup, o.dropoff, o.notes, o.driver && o.driver.name, o.driver && o.driver.phone]
    .some((v) => String(v || '').toLowerCase().includes(q))) : rows;
  app.last.orders = list;
  const done = list.filter((o) => o.status === 'completed');
  paint(seq, `
    <section class="panel">
      <div class="filters">${chips('orders', 'period', PERIODS, f.period)}</div>
      ${f.period === 'custom' ? `<div style="margin-top:12px">${customRange('orders', f)}</div>` : ''}
      <div class="filters" style="margin-top:12px">
        ${chips('orders', 'status', [['', 'كل الحالات'], ['pending', 'قيد التنفيذ'], ['completed', 'مكتمل'], ['cancelled', 'ملغى']], f.status)}
        ${driverSelect('orders.driverId', f.driverId)}
        <label class="search">${ic('search')}<span class="sr-only">بحث</span><input class="input" type="search" placeholder="بحث برقم الطلب أو الهاتف أو المكان" value="${esc(f.q)}" data-filter="orders.q"></label>
      </div>
    </section>
    <section class="panel">
      <header class="panel-head">
        <div class="summary"><span>عدد الطلبات: <b>${list.length}</b></span><span>المكتملة: <b>${done.length}</b></span>
          <span>قيمة المكتمل: <b>${money(sumOf(done, 'price'))}</b></span><span>عمولتك: <b>${money(sumOf(list, 'commission'))}</b> ${cur()}</span></div>
        <span class="spacer" style="flex:1"></span>
        <button type="button" class="btn sm ghost no-print" data-action="export-orders">${ic('download')} تصدير CSV</button>
      </header>
      ${list.length ? `<div class="olist">
        <div class="orow head"><span>الطلب</span><span>المسار</span><span>الزبون والسائق</span><span style="text-align:end">السعر</span><span style="text-align:end">العمولة</span><span>الحالة</span></div>
        ${list.map(orderRow).join('')}</div>`

    </section>`);
}

function orderRow(o) {
  const st = STATUS[o.status] || STATUS.pending;
  return `<article class="orow" data-action="edit-order" data-id="${o.id}" tabindex="0" role="button" aria-label="الطلب ${esc(o.ref)}">

    <div class="c-route">${esc(o.pickup)}<span class="arrow">←</span>${esc(o.dropoff)}${o.notes ? `<span class="muted" style="display:block;font-size:13px;font-weight:400">${esc(o.notes)}</span>` : ''}</div>

    <div class="c-price"><span class="cell-label">السعر</span>${money(o.price)}</div>

function balanceFlag(d) {
  const b = num(d.balance);
  if (!d.active) return '<span class="flag off">موقوف</span>';
  if (b < 0) return `<span class="flag neg">${ic('alert')} رصيد سالب</span>`;
  if (b < lowLimit()) return `<span class="flag low">${ic('alert')} رصيد منخفض</span>`;
  return '';
}

async function viewReports(seq) {
  const f = app.f.reports;

  const y0 = new Date().getFullYear();
  const years = []; for (let y = y0 + 1; y >= Math.min(2024, Number(f.year)); y--) years.push(y);
  const row = (label, r, cls = '') => `<tr class="${cls} ${num(r.commission) || num(r.topups) || num(r.completed_orders) ? '' : 'zero'}"><td>${label}</td>

  paint(seq, `

function driverOptions(selectedId, includeId) {
  return app.drivers.filter((d) => d.active || d.id === includeId || d.id === selectedId)
    .map((d) => `<option value="${d.id}" ${d.id === selectedId ? 'selected' : ''}>${esc(dtext(d))} – رصيد ${money(d.balance)}</option>`).join('');
}

function voiceWidget(box, existingPath) {
  const st = { file: null, url: null, removed: false, rec: null, stream: null, timer: null, t0: 0 };
  const canRec = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  const setFile = (f) => { if (st.url) URL.revokeObjectURL(st.url); st.file = f; st.url = URL.createObjectURL(f); st.removed = true; draw(); };
  const stopStream = () => { if (st.stream) st.stream.getTracks().forEach((t) => t.stop()); st.stream = null; clearInterval(st.timer); };
  const draw = async () => {
    if (st.rec) {
      box.innerHTML = `<span class="rec-dot" aria-hidden="true"></span><span data-timer>0:00</span>
        <button type="button" class="btn sm danger" data-v="stop">${ic('stop')} إيقاف التسجيل</button>`;
      return;
    }
    const showExisting = existingPath && !st.removed && !st.file;
    box.innerHTML = `${canRec ? `<button type="button" class="btn sm" data-v="rec">${ic('mic')} تسجيل رسالة</button>` : ''}
      <label class="btn sm">${ic('clip')} إرفاق ملف صوتي<input type="file" class="sr-only" accept="audio/*,.m4a,.mp3,.aac,.wav,.ogg,.opus,.webm" data-v="file"></label>
      ${st.file ? `<audio controls src="${st.url}"></audio>` : ''}${showExisting ? '<audio controls data-existing></audio>' : ''}
      ${st.file || showExisting ? `<button type="button" class="btn sm ghost" data-v="clear">${ic('trash')} حذف الرسالة</button>` : ''}
      ${!st.file && !showExisting ? '<span class="muted" style="font-size:14px">اختياري</span>' : ''}`;
    if (showExisting) {
      const a = $('audio[data-existing]', box);
      try {
        const u = await app.api.voiceUrl(existingPath);
        if (u) a.src = u; else a.outerHTML = '<span class="muted">الرسالة غير متوفرة في الوضع التجريبي بعد إعادة التحميل.</span>';
      } catch (e) { a.outerHTML = `<span class="err">${esc(errMsg(e))}</span>`; }
    }
  };
  const start = async () => {
    try {
      st.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
      const mime = types.find((t) => window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
      const rec = new MediaRecorder(st.stream, mime ? { mimeType: mime } : undefined);
      const chunks = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        const type = rec.mimeType || mime || 'audio/mp4';
        stopStream(); st.rec = null;
        const blob = new Blob(chunks, { type });
        const ext = type.includes('webm') ? 'webm' : type.includes('ogg') ? 'ogg' : 'm4a';
        setFile(new File([blob], `voice.${ext}`, { type }));
      };
      st.rec = rec; rec.start(); st.t0 = Date.now(); draw();
      st.timer = setInterval(() => {
        const s = Math.floor((Date.now() - st.t0) / 1000);
        const el = $('[data-timer]', box); if (el) el.textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`;
      }, 500);
    } catch (e) {
      stopStream(); st.rec = null; draw();
      toast('لم يُسمح باستخدام الميكروفون. يمكنك إرفاق ملف صوتي بدلاً من ذلك.', 'warn');
    }
  };
  box.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-v]'); if (!b) return;
    if (b.dataset.v === 'rec') start();
    else if (b.dataset.v === 'stop' && st.rec) st.rec.stop();
    else if (b.dataset.v === 'clear') { st.file = null; st.removed = true; draw(); }
  });
  box.addEventListener('change', (e) => {
    if (!e.target.matches('[data-v=file]')) return;
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (f.size > 15 * 1024 * 1024) { toast('الملف الصوتي كبير جداً (الحد 15 ميغابايت).', 'bad'); return; }
    setFile(f);
  });
  draw();
  return {
    get file() { return st.file; },
    get removed() { return st.removed; },
    get recording() { return !!st.rec; },
    dispose() { if (st.rec) { try { st.rec.onstop = null; st.rec.stop(); } catch (e) { /* ignoré */ } } stopStream(); },
  };
}

    <div class="field"><span>الحالة</span><div class="seg" role="radiogroup" aria-label="الحالة">${statuses.map((s) => `<label><input type="radio" name="status" value="${s}" ${(o ? o.status : 'pending') === s ? 'checked' : ''}><span>${STATUS[s].label}</span></label>`).join('')}</div></div>
